<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuvPages 💌</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fff4f8;
            color: #333;
        }

        .hero {
            padding: 100px 20px;
            background: linear-gradient(135deg, #ffd6e8, #fff);
        }

        h1 {
            color: #e83e8c;
            font-size: 45px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 25px;
            background: #e83e8c;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        .card {
            background: white;
            margin: 25px auto;
            padding: 25px;
            width: 80%;
            max-width: 350px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>LuvPages 💌</h1>

        <p>
            Digital surprises made especially for your favorite people. 💗
        </p>

        <a href="#birthday" class="button">
            See Birthday Surprise 🎂
        </a>
    </div>

    <div id="birthday" class="card">

        <h2>🎂 Birthday Surprise</h2>

        <p>
            Give someone a birthday surprise they'll never forget.
        </p>

        <p><strong>75 ETB</strong></p>

        <a class="button" href="#">
            Order 💌
        </a>

    </div>

</body>
  </html>
