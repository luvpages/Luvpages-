<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Song For You 🎵</title>

<style>
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffd6e8,#fff);
text-align:center;
padding:20px;
color:#4a2633;
}

.card{
background:white;
padding:35px 25px;
border-radius:30px;
max-width:550px;
width:100%;
box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.disc{
font-size:80px;
animation:spin 5s linear infinite;
}

h1{
font-family:Georgia,serif;
color:#e83e8c;
}

p{
line-height:1.7;
font-size:18px;
}

.note{
font-size:13px;
opacity:.6;
margin-top:20px;
}

.button{
display:inline-block;
margin-top:20px;
padding:14px 25px;
background:#e83e8c;
color:white;
text-decoration:none;
border-radius:30px;
}

@keyframes spin{
to{transform:rotate(360deg)}
}
  .music-player{
    margin-top:25px;
    padding:25px;
    border-radius:22px;
    background:#fff4f8;
}

.music-icon{
    font-size:55px;
    animation:pulseMusic 1.8s ease-in-out infinite;
}

audio{
    width:100%;
    margin-top:15px;
}

@keyframes pulseMusic{
    50%{
        transform:scale(1.08);
    }
  }
</style>
</head>

<body>

<div class="card">

<div class="disc">💿</div>

<h1>A Song For You 🎵</h1>

<p>
Every special memory deserves a soundtrack.
</p>

<div class="music-player">

    <div class="music-icon">🎵</div>

    <h2>Our Song</h2>

    <p>A little soundtrack for this special moment 💗</p>

    <audio controls>
        <source src=music/"Cardi_B,_Bad_Bunny___J_Balvin_-_I_Like_It_[Official_Music_Video](256k).mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

</div>

<p class="note">
When making a customer's page, replace this section with their chosen music.
</p>

<a href="surprise.html" class="button">
There's One More Thing... 👀
</a>

</div>

</body>
</html>
